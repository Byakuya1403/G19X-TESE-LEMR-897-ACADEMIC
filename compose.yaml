services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: byakuyo
      POSTGRES_USER: byakuyo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crea .env y establece POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byakuyo -d byakuyo"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://byakuyo:${POSTGRES_PASSWORD}@db:5432/byakuyo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "127.0.0.1:8080:80"
volumes:
  postgres_data:
